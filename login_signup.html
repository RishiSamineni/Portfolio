<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login and Registration Form</title>
        <link rel="icon" type="image/x-icon" href="web_design_logo.jpeg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="login_signup.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    </head>
    <body>
        <div class="container">
            <div class="curved-shape"></div>
            <div class="curved-shape2"></div>
            <div class="form-box Login">
                <h2 class="animation" style="--D:0; --S:21">Login</h2>
                <form action="Portfolio.htm">
                    <div class="input-box animation" style="--D:1; --S:22">
                        <input type="text" required>
                        <label for="username">Username</label>
                        <i class="material-icons">person</i>
                    </div>
                    <div class="input-box animation" style="--D:2; --S:23">
                        <input type="password" id="password" required>
                        <label for="password">Password</label>
                        <i class="material-icons" id="pswd">lock</i>
                    </div>
                    <div class="input-box animation" style="--D:3; --S:24">
                        <button class="btn" type="submit">Login</button>
                    </div>
                    <div class="reg-link animation" style="--D:4; --S:25">
                        <p>Don't have an account ? <a href="#" class="SignUpLink">Sign In</a></p>
                    </div>
                </form>
            </div>
            <div class="info-content Login">
                <h2 class="animation" style="--D:0; --S:20">WELCOME BACK!</h2>
                <p class="animation" style="--D:1; --S:21">Login to enhance Popular Tech Skills in the Industry.</p>
            </div>
            <div class="form-box Register">
                <h2 class="animation" style="--li:17; --S:0">Register</h2>
                <form onsubmit="RegFunction()">
                    <div class="input-box animation" style="--li:18; --S:1">
                        <input type="text" required>
                        <label for="username">Username</label>
                        <i class="material-icons">person</i>
                    </div>
                    <div class="input-box animation" style="--li:19; --S:2">
                        <input type="email" required>
                        <label for="email">Email</label>
                        <i class="material-icons">mail</i>
                    </div>
                    <div class="input-box animation" style="--li:20; --S:3">
                        <input type="password" id="passWord" required>
                        <label for="password">Password</label>
                        <i class="material-icons" id="psd">lock</i>
                    </div>
                    <div class="input-box animation" style="--li:21; --S:4">
                        <button class="btn" type="submit">Register</button>
                    </div>
                    <div class="reg-link animation" style="--li:22; --S:5">
                        <p>Already have an account <a href="#" class="SignInLink">Login</a></p>
                    </div>
                </form>
            </div>
            <div class="info-content Register">
                <h2 class="animation" style="--li:17; --S:0">WELCOME</h2>
                <p class="animation" style="--li:18; --S:1">Sign Up if you don't have an account.</p>
            </div>
        </div>
        <script src="login_signup.js"></script>
    </body>
</html>
